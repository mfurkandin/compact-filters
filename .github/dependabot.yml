version: 2
updates:
  # Pinned action SHAs get update pull requests too
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: dev

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    target-branch: dev
    groups:
      dev-dependencies:
        dependency-type: development
